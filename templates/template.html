<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{name}} - Portfolio</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body class="{{theme}}">

<div class="container">

    <!-- HERO SECTION -->

    <div class="hero">

        <img
            src="/static/profile.jpg"
            class="profile"
            alt="Profile Photo"
        >

        <h1>{{name}}</h1>

        <h2>{{headline}}</h2>

        <div class="hero-buttons">

            <a
                href="/download"
                class="download-btn"
            >
                📄 Download PDF
            </a>

            <a
                href="/"
                class="create-btn"
            >
                ✨ Create Another
            </a>

        </div>

    </div>


    <!-- ABOUT -->

    <div class="card">

        <h3>👋 About Me</h3>

        <p class="summary">
            {{summary}}
        </p>

    </div>


    <!-- SKILLS -->

    <div class="card">

        <h3>💻 Skills</h3>

        <div class="skills-container">

            {{skills}}

        </div>

    </div>


    <!-- PROJECTS -->

    <div class="card">

        <h3>🚀 Projects</h3>

        <div class="projects-container">

            {{projects}}

        </div>

    </div>


    <!-- EDUCATION -->

    <div class="card">

        <h3>🎓 Education</h3>

        {{education}}

    </div>


    <!-- ACHIEVEMENTS -->

    <div class="card">

        <h3>🏆 Achievements</h3>

        {{achievements}}

    </div>


    <!-- CONTACT -->

    <div class="card">

        <h3>📬 Contact</h3>

        {{contact}}

    </div>


    <!-- FOOTER -->

    <footer>

        <p>
            ✨ Generated using AI Resume Portfolio Generator
        </p>

    </footer>

</div>

</body>

</html>

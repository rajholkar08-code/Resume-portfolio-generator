<!DOCTYPE html>
<html>
<head>
    <title>{{name}} Portfolio</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="hero">

        <img src="/static/profile.jpg"
             class="profile">

        <h1>{{name}}</h1>

        <h2>{{headline}}</h2>

        <a href="/download" class="download-btn">
            Download PDF
        </a>

    </div>

    <div class="card">
        <h3>About Me</h3>
        <p>{{summary}}</p>
    </div>

    <div class="card">
        <h3>Skills</h3>
        {{skills}}
    </div>

    <div class="card">
        <h3>Projects</h3>
        {{projects}}
    </div>

    <div class="card">
        <h3>Education</h3>
        {{education}}
    </div>

    <div class="card">
        <h3>Achievements</h3>
        {{achievements}}
    </div>

    <div class="social-icons">
        🌐 💼 📧
    </div>
    <div class="card">
        <h3>Contact</h3>
        {{contact}}
    </div>

    <footer>
    <p>Generated using AI Resume Portfolio Generator</p>
    </footer>

</div>

</body>
</html>
